server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    #SPA必须，否则刷新会404
    #/tickets/1 这种路径服务器上没有对应文件，必须回退到 index.html 让前端路由接管
    try_files $uri $uri/ /index.html;   
  }
}