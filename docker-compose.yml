services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      POSTGRES_DB: mini_mes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mini_mes"]
      interval: 5s
      retries: 10
    ports:
      - "5433:5432"        # 避开你本机那个 5432

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mes:mes@db:5432/mini_mes
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata: